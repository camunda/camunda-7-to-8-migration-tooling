# Cross-vendor setup: Camunda 7 on MS SQL Server, Camunda 8 (RDBMS) on PostgreSQL.
camunda:
  migrator:
    auto-ddl: true
    c7:
      data-source:
        auto-ddl: true
        username: sa
        password: Camunda123!
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

---

spring:
  config:
    activate:
      on-profile: history-level-full

camunda:
  migrator:
    auto-ddl: true
    c8:
      data-source:
        auto-ddl: true
        username: camunda
        password: camunda
        driver-class-name: org.postgresql.Driver
