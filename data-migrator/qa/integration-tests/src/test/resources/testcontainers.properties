# Disable the Ryuk resource reaper.
#
# Testcontainers uses Ryuk to clean up containers after the JVM exits. On certain CI
# runners the Ryuk image (testcontainers/ryuk:<version>) cannot be pulled from Docker Hub,
# which causes a ContainerFetchException during MultiDbExtension initialisation and fails
# every integration test that depends on it.
#
# Ryuk is unnecessary here because:
#   1. All database containers already use withReuse(true), so they are intentionally
#      kept alive between test forks and cleaned up by the ephemeral CI runner on
#      shutdown.
#   2. The CI runners are ephemeral (ubuntu-latest); the host's Docker daemon is
#      terminated with the job, so there is no container leak.
ryuk.disabled=true
