server:
  forward-headers-strategy: framework
  tomcat:
    max-part-count: 100

spring:
  servlet:
    multipart:
      resolve-lazily: true
      # Real-world BPMN, DMN, and form models can exceed Spring's 1 MB default.
      # Allow up to 10 MB per model and 100 MB for the 100-part batch endpoint.
      max-file-size: 10MB
      max-request-size: 100MB

webapp:
  cors:
    allowed-origins: []

notification:
  slack:
    enabled: false
    token: ""
    channel-name: ""

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
