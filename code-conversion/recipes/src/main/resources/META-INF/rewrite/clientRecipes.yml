type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.AllClientRecipes
displayName: Runs all client recipes
description: Runs all client recipes.
recipeList:
  - io.camunda.migration.code.recipes.AllClientPrepareRecipes
  - io.camunda.migration.code.recipes.AllClientMigrateRecipes
  - io.camunda.migration.code.recipes.AllClientCleanupRecipes
  # Migrate the Spring Boot configuration file (camunda.bpm.* -> camunda.client.*).
  # Unambiguous cleanup, so it runs as part of the standard client migration.
  - io.camunda.migration.code.recipes.MigrateApplicationPropertiesRecipe
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.ConfigureCamundaStarterRecipe
displayName: Configure Camunda starter by Spring Boot major
description: >-
  Adds the Camunda starter matching the project's Spring Boot major version.
  Defaults to the Spring Boot 3 starter, then switches to the Spring Boot 4
  starter when Spring Boot 4 is detected in parent, BOM, or spring-boot.version.
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
      version: ${version.camunda-8}
  - org.openrewrite.gradle.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      configuration: implementation
  - org.openrewrite.gradle.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
      version: ${version.camunda-8}
      configuration: implementation
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenParentIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenBomIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenPropertyIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenGradlePluginIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenGradleBootBomIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenGradleBootPropertyIsBoot4
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.ConfigureCamundaProcessTestDependencyRecipe
displayName: Configure Camunda process-test dependency by Spring Boot major
description: >-
  Adds the process-test module matching the detected Spring Boot major.
  Defaults to the Spring Boot 3 module and switches to the Spring Boot 4 module
  when Spring Boot 4 is detected.
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-process-test-spring
      scope: test
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-process-test-spring-boot-3
      version: ${version.camunda-8}
      scope: test
  - org.openrewrite.gradle.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-process-test-spring
      configuration: testImplementation
  - org.openrewrite.gradle.AddDependency:
      groupId: io.camunda
      artifactId: camunda-process-test-spring-boot-3
      version: ${version.camunda-8}
      configuration: testImplementation
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenParentIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenBomIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenPropertyIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenGradlePluginIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenGradleBootBomIsBoot4
  - io.camunda.migration.code.recipes.client.UseSpringBoot4ProcessTestWhenGradleBootPropertyIsBoot4
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenParentIsBoot4
displayName: Use Spring Boot 4 Camunda starter when parent is Boot 4
description: Switches to the Spring Boot 4 Camunda starter if spring-boot-starter-parent is 4.x.
preconditions:
  - org.openrewrite.maven.search.ParentPomInsight:
      groupIdPattern: org.springframework.boot
      artifactIdPattern: spring-boot-starter-parent
      version: "4.x"
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      version: ${version.camunda-8}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenBomIsBoot4
displayName: Use Spring Boot 4 Camunda starter when BOM is Boot 4
description: Switches to the Spring Boot 4 Camunda starter if spring-boot-dependencies BOM is 4.x.
preconditions:
  - org.openrewrite.maven.search.FindManagedDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      version: "4.x"
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      version: ${version.camunda-8}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenPropertyIsBoot4
displayName: Use Spring Boot 4 Camunda starter when spring-boot.version is 4
description: Switches to the Spring Boot 4 Camunda starter if spring-boot.version property starts with 4.
preconditions:
  - org.openrewrite.maven.search.FindProperties:
      propertyPattern: "^spring-boot\\.version$"
      valuePattern: "^4\\..*"
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      version: ${version.camunda-8}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.client.UseSpringBoot4CamundaStarterWhenGradlePluginIsBoot4
displayName: Use Spring Boot 4 Camunda starter when Gradle Spring Boot plugin is 4
description: Switches to the Spring Boot 4 Camunda starter if the Gradle Spring Boot plugin version is 4.x.
preconditions:
  - org.openrewrite.text.Find:
      find: "id\\([\"']org\\.springframework\\.boot[\"']\\)\\s*version\\s*[\"']4\\.[^\"']*[\"']|id\\s+[\"']org\\.springframework\\.boot[\"']\\s+version\\s+[\"']4\\.[^\"']*[\"']"
      regex: true
      filePattern: "**/build.gradle;**/build.gradle.kts"
recipeList:
  - org.openrewrite.gradle.RemoveDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
      configuration: implementation
  - org.openrewrite.gradle.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      version: ${version.camunda-8}
      configuration: implementation
---
