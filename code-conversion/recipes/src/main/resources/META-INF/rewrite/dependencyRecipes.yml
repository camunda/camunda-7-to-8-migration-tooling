      major: "4"
  - io.camunda.migration.code.recipes.sharedRecipes.DoesNotDeclareGradleDependencyRecipe:
      groupId: io.camunda
      artifactId: camunda-process-test-spring
  - io.camunda.migration.code.recipes.sharedRecipes.DoesNotDeclareGradleDependencyRecipe:
      groupId: io.camunda
