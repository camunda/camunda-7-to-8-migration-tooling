# The Spring Boot 3 starter is the default landing spot for a migrated Camunda 7 application; the
# `UseSpringBoot4...` recipes below upgrade it when the project actually resolves Spring Boot 4.
# The precondition keeps this step a no-op once either starter is declared, which is what makes
# the recipe converge in a single cycle and stay idempotent on re-runs.
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.sharedRecipes.AddCamundaStarterWhenAbsent
displayName: Add the Camunda Spring Boot 3 starter when no Camunda starter is declared
description: >-
  Adds `camunda-spring-boot-3-starter` when the project declares neither Camunda starter. Gradle
  builds are handled separately because Maven-model preconditions never match a Gradle build file.
preconditions:
  - org.openrewrite.maven.search.DoesNotIncludeDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-starter
      onlyDirect: true
  - org.openrewrite.maven.search.DoesNotIncludeDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
      onlyDirect: true
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: io.camunda
      artifactId: camunda-spring-boot-3-starter
      version: ${version.camunda-8}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.camunda.migration.code.recipes.sharedRecipes.AddCamundaProcessTestDependencyWhenAbsent
displayName: Add the Camunda Spring Boot 3 process test module when no process test module is declared
description: >-
  Adds `camunda-process-test-spring-boot-3` in test scope when the project declares neither
  process test module.
preconditions:
