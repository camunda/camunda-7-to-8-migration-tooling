name: Release

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        description: "RELEASE_VERSION"
        required: true
        default: "0.0.0"
      DEVELOPMENT_VERSION:
        required: true
        description: "DEVELOPMENT_VERSION"
        default: "0.1.0-SNAPSHOT"
      IS_DRY_RUN:
        description: "DRY_RUN"
        required: true
        type: boolean
        default: true
      ONLY_PUSH_TO_MAVEN_CENTRAL:
        # To push artefact from tag to maven central. Useful if artefacts are cleaned up before they are released.
        description: "ONLY_PUSH_TO_MAVEN_CENTRAL"
        required: true
        type: boolean
        default: false
      DEPLOY_DIAGRAM_CONVERTER:
        description: "DEPLOY_DIAGRAM_CONVERTER (don't check for alpha and patches < latest minor)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
  IS_DRY_RUN: ${{ inputs.IS_DRY_RUN }}
  ONLY_PUSH_TO_MAVEN_CENTRAL: ${{ inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
  DEVELOPMENT_VERSION: ${{ inputs.DEVELOPMENT_VERSION }}
  PUSH_CHANGES: ${{ inputs.IS_DRY_RUN == false }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Maven Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Output Inputs
        run: echo "${{ toJSON(github.event.inputs) }}"

      # This step generates a GitHub App token to be used in Git operations as a workaround for
      # the known GitHub issue described in https://github.com/camunda/camunda/issues/28522
      - name: Generate GitHub token
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/cambpm/ci/github-workflow
          github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
          github-app-private-key-vault-path: secret/data/products/cambpm/ci/github-workflow
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID}}
          vault-url: ${{ secrets.VAULT_ADDR }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # Overriding the default GITHUB_TOKEN with a GitHub App token in order to workaround
          # the known GitHub issue described in https://github.com/camunda/camunda/issues/28522
          # NOTES:
          # - This token will be used for all git operations in this job
          # - This token expires after 1 hour (https://github.com/actions/create-github-app-token?tab=readme-ov-file#create-github-app-token)
          token: ${{ steps.github-token.outputs.token }}

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PUB;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_USR;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_PSW;

      - name: Git User Setup
        run: |
          git config --global user.email "github-actions[release]"
          git config --global user.name "github-actions[release]@users.noreply.github.com"

      - name: Validate release ref
        if: ${{ !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/release/* && "${GITHUB_REF}" != refs/heads/maintenance/* ]]; then
            echo "::error::Full releases must run from a release/* or maintenance/* branch. Use ONLY_PUSH_TO_MAVEN_CENTRAL=true to publish an existing release tag to Maven Central without running release:prepare."
            exit 1
          fi

      - name: Install Maven Central GPG Key
        # setup-maven supports this as well but needs the key in the armor ascii format,
        # while we only have it plain bas64 encoded
        # see https://github.com/actions/setup-java/issues/100#issuecomment-742679976
        run: |
          echo -n "${{ steps.secrets.outputs.MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC }}" \
            | base64 --decode \
            | gpg -q --allow-secret-key-import --import --no-tty --batch --yes
          echo -n "${{ steps.secrets.outputs.MAVEN_CENTRAL_GPG_SIGNING_KEY_PUB }}" \
            | base64 --decode \
            | gpg -q --import --no-tty --batch --yes
          
      - name: Setup Build Tooling
        uses: ./.github/actions/setup-maven
        with:
          maven-servers: |
            [{
                "id": "central",
                "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}",
                "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"
            }]
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          camunda-nexus: true

      - name: Maven Prepare Release
        if: ${{ !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
        id: maven-prepare-release
        run: |
          # Preparing the maven release
          # https://maven.apache.org/maven-release/maven-release-plugin/prepare-mojo.html
          # https://maven.apache.org/maven-release/maven-release-plugin/usage/prepare-release.html
          mvn release:prepare -B \
            -Dresume=false \
            -Dtag=${RELEASE_VERSION} \
            -DreleaseVersion=${RELEASE_VERSION} \
            -DdevelopmentVersion=${DEVELOPMENT_VERSION} \
            -DpushChanges=${PUSH_CHANGES} \
            -DremoteTagging=${PUSH_CHANGES} \
            -DignoreSnapshots=true \
            -Darguments='-Dgpg.passphrase="${{ steps.secrets.outputs.MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE }}" -DskipTests=true'

      - name: Collect Release Artifacts
        if: ${{ !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
        id: release-artifacts
        run: |
          set -euo pipefail

          ARTIFACT_DIR=$(mktemp -d)
          release_assets=(
            "data-migrator/assembly/target/camunda-7-to-8-data-migrator-${RELEASE_VERSION}.tar.gz"
            "data-migrator/assembly/target/camunda-7-to-8-data-migrator-${RELEASE_VERSION}.zip"
            "data-migrator/plugins/cockpit/target/camunda-7-to-8-data-migrator-cockpit-plugin-${RELEASE_VERSION}.jar"
            "code-conversion/recipes/target/camunda-7-to-8-code-conversion-recipes-${RELEASE_VERSION}.jar"
            "diagram-converter/core/target/camunda-7-to-8-diagram-converter-core-${RELEASE_VERSION}.jar"
            "diagram-converter/webapp/target/camunda-7-to-8-diagram-converter-webapp-${RELEASE_VERSION}.jar"
            "diagram-converter/cli/target/camunda-7-to-8-diagram-converter-cli-${RELEASE_VERSION}.jar"
          )

          for asset in "${release_assets[@]}"; do
            cp "${asset}" "${ARTIFACT_DIR}/"
            basename "${asset}" >> "${ARTIFACT_DIR}/release-assets.txt"
          done

          echo "dir=${ARTIFACT_DIR}" >> $GITHUB_OUTPUT

      - name: Upload Release Artifacts
        if: ${{ !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: ${{ steps.release-artifacts.outputs.dir }}
          retention-days: 14

      - name: Maven Perform Release - Artifactory
        if: ${{ !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
        id: maven-perform-release-camunda
        env:
          SKIP_REPO_DEPLOY: ${{ inputs.IS_DRY_RUN }}
        run: |
          # Perform a maven release
          # https://maven.apache.org/maven-release/maven-release-plugin/perform-mojo.html
          # https://maven.apache.org/maven-release/maven-release-plugin/usage/perform-release.html
          mvn release:perform -B \
            -Dgpg.passphrase="${{ steps.secrets.outputs.MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE }}" \
            -DlocalCheckout=${{ inputs.IS_DRY_RUN }} \
            -Pcentral-sonatype-publish,distro \
            -Darguments='-DskipTests=true -Dskip.central.release=true -Dskip.camunda.release=${SKIP_REPO_DEPLOY}'

      - name: Checkout Code
        # The release tag exists for backfills even when running a dry run.
        if: ${{ inputs.ONLY_PUSH_TO_MAVEN_CENTRAL || !inputs.IS_DRY_RUN }}
        uses: actions/checkout@v7
        with:
          # Checkout the release tag to perform a second deployment 
          ref: ${{ env.RELEASE_VERSION }}
          token: ${{ steps.github-token.outputs.token }}

      - name: Maven Perform Release - Maven Central
        id: maven-perform-release-maven-central
        env:
          SKIP_REPO_DEPLOY: ${{ inputs.IS_DRY_RUN }}
        run: |
          mvn deploy -B \
            -Dgpg.passphrase="${{ steps.secrets.outputs.MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE }}" \
            -DlocalCheckout=${{ inputs.IS_DRY_RUN }} \
            -Pcentral-sonatype-publish,central-release \
            -DskipTests=true \
            -Dskip.central.release=${SKIP_REPO_DEPLOY} \
            -Dskip.camunda.release=true \
            -Dcentral.autoPublish=true \
            -DwaitUntil=published

      - name: Verify Maven Central publication
        if: ${{ !inputs.IS_DRY_RUN }}
        run: |
          set -euo pipefail

          artifacts=(
            "io/camunda/camunda-7-to-8-migration-tooling-root/${RELEASE_VERSION}/camunda-7-to-8-migration-tooling-root-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-code-conversion-parent/${RELEASE_VERSION}/camunda-7-to-8-code-conversion-parent-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-code-conversion-recipes/${RELEASE_VERSION}/camunda-7-to-8-code-conversion-recipes-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-code-conversion-recipes/${RELEASE_VERSION}/camunda-7-to-8-code-conversion-recipes-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-data-migrator-parent/${RELEASE_VERSION}/camunda-7-to-8-data-migrator-parent-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-data-migrator-core/${RELEASE_VERSION}/camunda-7-to-8-data-migrator-core-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-data-migrator-core/${RELEASE_VERSION}/camunda-7-to-8-data-migrator-core-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-data-migrator-cockpit-plugin/${RELEASE_VERSION}/camunda-7-to-8-data-migrator-cockpit-plugin-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-data-migrator-cockpit-plugin/${RELEASE_VERSION}/camunda-7-to-8-data-migrator-cockpit-plugin-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-diagram-converter-parent/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-parent-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-diagram-converter-core/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-core-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-diagram-converter-core/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-core-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-diagram-converter-webapp/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-webapp-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-diagram-converter-webapp/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-webapp-${RELEASE_VERSION}.pom"
            "io/camunda/camunda-7-to-8-diagram-converter-cli/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-cli-${RELEASE_VERSION}.jar"
            "io/camunda/camunda-7-to-8-diagram-converter-cli/${RELEASE_VERSION}/camunda-7-to-8-diagram-converter-cli-${RELEASE_VERSION}.pom"
          )

          for attempt in {1..30}; do
            missing=()
            for artifact in "${artifacts[@]}"; do
              if ! curl --fail --head --location --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                "https://repo.maven.apache.org/maven2/${artifact}" >/dev/null; then
                missing+=("${artifact}")
              fi
            done

            if ((${#missing[@]} == 0)); then
              echo "All Maven Central artifacts for ${RELEASE_VERSION} are available."
              exit 0
            fi

            echo "::notice::Maven Central propagation is incomplete for ${RELEASE_VERSION}; ${#missing[@]} artifact(s) are still unavailable (attempt ${attempt}/30)."
            sleep 20
          done

          echo "::error::Maven Central publication verification failed for ${RELEASE_VERSION}."
          printf 'Missing artifact: %s\n' "${missing[@]}"
          exit 1

  publish-github-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !inputs.IS_DRY_RUN && !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
    timeout-minutes: 15
    concurrency:
      group: github-release-assets-${{ inputs.RELEASE_VERSION }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: ./release-assets

      - name: Create or reuse draft GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json=$(mktemp)
          release_error=$(mktemp)
          trap 'rm -f "${release_json}" "${release_error}"' EXIT

          expected_prerelease=false
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            expected_prerelease=true
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" \
            > "${release_json}" 2> "${release_error}"; then
            release_draft=$(jq --raw-output '.draft' "${release_json}")
            release_prerelease=$(jq --raw-output '.prerelease' "${release_json}")

            if [[ "${release_prerelease}" != "${expected_prerelease}" ]]; then
              echo "::error::Release '${RELEASE_VERSION}' has prerelease=${release_prerelease}, expected ${expected_prerelease}."
              exit 1
            fi
          else
            if [[ "$(jq --raw-output '.status // empty' "${release_json}")" != 404 ]]; then
              cat "${release_error}" >&2
              cat "${release_json}" >&2
              echo "::error::Could not determine whether GitHub release '${RELEASE_VERSION}' exists."
              exit 1
            fi

            release_flags=(
              --repo "${GITHUB_REPOSITORY}"
              --title "${RELEASE_VERSION}"
              --draft
              --generate-notes
              --verify-tag
            )
            if [[ "${expected_prerelease}" == true ]]; then
              release_flags+=(--prerelease)
            fi

            gh release create "${RELEASE_VERSION}" "${release_flags[@]}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" > "${release_json}"
            release_draft=$(jq --raw-output '.draft' "${release_json}")
            release_prerelease=$(jq --raw-output '.prerelease' "${release_json}")
            if [[ "${release_draft}" != true || "${release_prerelease}" != "${expected_prerelease}" ]]; then
              echo "::error::New GitHub release '${RELEASE_VERSION}' has an unexpected state."
              exit 1
            fi
          fi

          if [[ "${release_draft}" != true && "${release_draft}" != false ]]; then
            echo "::error::GitHub release '${RELEASE_VERSION}' returned an invalid draft state '${release_draft}'."
            exit 1
          fi

          echo "draft=${release_draft}" >> "${GITHUB_OUTPUT}"

      - name: Upload GitHub release assets
        if: ${{ steps.github-release.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset_directory=release-assets
          manifest="${asset_directory}/release-assets.txt"
          if [[ ! -s "${manifest}" ]]; then
            echo "::error::Release asset manifest '${manifest}' is missing or empty."
            exit 1
          fi

          mapfile -t assets < "${manifest}"
          if ((${#assets[@]} != 7)); then
            echo "::error::Expected seven release assets, found ${#assets[@]}."
            exit 1
          fi

          duplicates=$(printf '%s\n' "${assets[@]}" | sort | uniq --repeated)
          if [[ -n "${duplicates}" ]]; then
            echo "::error::Release asset manifest contains duplicates:"
            printf '%s\n' "${duplicates}"
            exit 1
          fi

          declare -A local_digests
          declare -A remote_digests
          remote_assets=$(gh release view "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
              --jq '.assets[] | [.name, .digest] | @tsv'
          while IFS=$'\t' read -r asset_name asset_digest; do
            [[ -z "${asset_name}" ]] && continue
            remote_digests["${asset_name}"]="${asset_digest}"
          done <<< "${remote_assets}"

          for asset in "${assets[@]}"; do
            asset_path="${asset_directory}/${asset}"
            if [[ ! -f "${asset_path}" ]]; then
              echo "::error::Expected release asset '${asset_path}' is missing."
              exit 1
            fi

            local_digests["${asset}"]="sha256:$(sha256sum "${asset_path}" | awk '{print $1}')"
            if [[ -n "${remote_digests[${asset}]+present}" ]] \
              && [[ "${remote_digests[${asset}]}" != "${local_digests[${asset}]}" ]]; then
              echo "::error::Existing asset '${asset}' has a different digest and will not be overwritten."
              echo "Expected: ${local_digests[${asset}]}"
              echo "Actual:   ${remote_digests[${asset}]}"
              exit 1
            fi
          done

          for asset in "${assets[@]}"; do
            if [[ -z "${remote_digests[${asset}]+present}" ]]; then
              gh release upload "${RELEASE_VERSION}" "${asset_directory}/${asset}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset_directory=release-assets
          manifest="${asset_directory}/release-assets.txt"
          mapfile -t assets < "${manifest}"
          if ((${#assets[@]} != 7)); then
            echo "::error::Expected seven release assets, found ${#assets[@]}."
            exit 1
          fi

          for attempt in {1..5}; do
            declare -A remote_digests=()
            remote_assets=$(gh release view "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.[] | [.name, .digest] | @tsv')
            while IFS=$'\t' read -r asset_name asset_digest; do
              [[ -z "${asset_name}" ]] && continue
              remote_digests["${asset_name}"]="${asset_digest}"
            done <<< "${remote_assets}"

            missing=()
            mismatched=()
            for asset in "${assets[@]}"; do
              asset_path="${asset_directory}/${asset}"
              expected_digest="sha256:$(sha256sum "${asset_path}" | awk '{print $1}')"
              if [[ -z "${remote_digests[${asset}]+present}" ]]; then
                missing+=("${asset}")
              elif [[ "${remote_digests[${asset}]}" != "${expected_digest}" ]]; then
                mismatched+=("${asset}")
              fi
            done

            if ((${#missing[@]} == 0 && ${#mismatched[@]} == 0)); then
              echo "Verified all ${#assets[@]} GitHub release assets for ${RELEASE_VERSION}."
              exit 0
            fi

            if ((attempt < 5)); then
              echo "::notice::GitHub release asset verification is incomplete (attempt ${attempt}/5)."
              sleep 2
            fi
          done

          echo "::error::GitHub release '${RELEASE_VERSION}' does not match the expected asset manifest."
          printf 'Missing asset: %s\n' "${missing[@]}"
          printf 'Mismatched asset: %s\n' "${mismatched[@]}"
          exit 1

      - name: Publish GitHub release
        if: ${{ steps.github-release.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" --jq '.draft')" != false ]]; then
            echo "::error::GitHub release '${RELEASE_VERSION}' is still a draft after publishing."
            exit 1
          fi

  docker-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - release
      - publish-github-release
    if: ${{ !inputs.IS_DRY_RUN && !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL }}
    timeout-minutes: 30

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: ./artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Import Vault Secrets for Registry Auth
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/cambpm/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/cambpm/ci/harbor password | HARBOR_PASSWORD;

      - name: Login to Camunda Registry
        uses: docker/login-action@v4
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.vault-secrets.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault-secrets.outputs.HARBOR_PASSWORD }}

      - name: Prepare Docker Context
        run: |
          mkdir -p docker-context
          cd docker-context
          tar -xzf ../artifacts/camunda-7-to-8-data-migrator-${{ env.RELEASE_VERSION }}.tar.gz
          cp ../artifacts/camunda-7-to-8-code-conversion-recipes-${RELEASE_VERSION}.jar ./
          cp ../artifacts/camunda-7-to-8-data-migrator-cockpit-plugin-${{ env.RELEASE_VERSION }}.jar ./
          cp ../artifacts/camunda-7-to-8-diagram-converter-core-${{ env.RELEASE_VERSION }}.jar ./
          cp ../artifacts/camunda-7-to-8-diagram-converter-webapp-${{ env.RELEASE_VERSION }}.jar ./
          cp ../artifacts/camunda-7-to-8-diagram-converter-cli-${{ env.RELEASE_VERSION }}.jar ./
          
          # Create Dockerfile
          cat > Dockerfile << 'EOF'
          FROM scratch
          COPY . /
          EOF

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-context
          push: true
          tags: registry.camunda.cloud/team-cambpm/c7-to-c8-data-migrator:${{ env.RELEASE_VERSION }}
          platforms: linux/arm64

  deploy-diagram-converter:
    name: Deploy Diagram Converter
    needs:
      - release
      - publish-github-release
    if: >-
      ${{
        always()
        && inputs.DEPLOY_DIAGRAM_CONVERTER
        && !inputs.ONLY_PUSH_TO_MAVEN_CENTRAL
        && needs.release.result == 'success'
        && (inputs.IS_DRY_RUN || needs.publish-github-release.result == 'success')
      }}
    uses: ./.github/workflows/deploy-diagram-converter.yml
    with:
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      IS_DRY_RUN: ${{ inputs.IS_DRY_RUN }}
      CALLED_FROM_RELEASE: true
    secrets: inherit
