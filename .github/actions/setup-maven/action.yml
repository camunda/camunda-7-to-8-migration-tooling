name: Setup Maven
description: |
  Maven wrapper to abstract defaults for setting maven up
inputs:
  camunda-nexus:
    description: |
      If enabled, Camunda Nexus will be configured and used as a mirror for Maven repositories
      Camunda Nexus is automatically disabled for fork PRs.
    required: false
    default: "true"
  java-version:
    description: Java version to be used
    required: false
    default: '21'
  distribution:
    description: Java distribution to be used
    required: false
    default: 'temurin'
  maven-mirrors:
    description: |
      JSON list of extra Maven mirrors.
      It will be merged with Camunda Nexus settings (if enabled ), with precedence."
    required: false
    default: '[]'
  maven-servers:
    description: |
      JSON list of extra Maven servers.
      It will be merged with Camunda Nexus settings (if enabled), with precedence."
    required: false
    default: '[]'
  maven-version:
    description: Maven version to be used
    required: false
    default: '3.9.16'
  vault-address:
    description: Vault URL to retrieve secrets from
    required: false
  vault-jwt-role:
    description: Vault JWT role to log in with, the calling job needs id-token write permission
    required: false
  vault-jwt-path:
    description: Vault JWT auth mount path
    required: false
  vault-jwt-audience:
    description: GitHub OIDC audience for the Vault JWT login
    required: false
outputs:
  maven-cache-hit:
    description: Whether setup-java restored Maven dependencies from cache
    value: ${{ steps.setup-java.outputs.cache-hit }}
runs:
  using: composite
  steps:
  - name: Import secrets
    id: secrets
    uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
    with:
      url: ${{ inputs.vault-address }}
      method: jwt
      role: ${{ inputs.vault-jwt-role }}
      path: ${{ inputs.vault-jwt-path }}
      jwtGithubAudience: ${{ inputs.vault-jwt-audience }}
      secrets: |
        secret/data/products/cambpm/ci/nexus USER | NEXUS_APP_CAMUNDA_COM_USR;
        secret/data/products/cambpm/ci/nexus PASSWORD | NEXUS_APP_CAMUNDA_COM_PSW;
        secret/data/products/cambpm/ci/artifactory USER | ARTIFACTORY_USR;
        secret/data/products/cambpm/ci/artifactory TOKEN | ARTIFACTORY_PSW;
  - name: Setup Java
    id: setup-java
    uses: actions/setup-java@v6
    with:
      java-version: ${{ inputs.java-version }}
      distribution: ${{ inputs.distribution }}
      cache: "maven"
  - name: Check preinstalled Maven
    id: check-maven
    shell: pwsh
    env:
      MAVEN_VERSION: ${{ inputs.maven-version }}
    run: |
      $maven = Get-Command mvn -ErrorAction SilentlyContinue
      $versionMatches = $false

      if ($null -ne $maven) {
        $mavenVersionOutput = @(& mvn --version)
        if ($LASTEXITCODE -ne 0 -or $mavenVersionOutput.Count -eq 0) {
          throw "Failed to query Maven on PATH."
        }

        $installedVersion = $mavenVersionOutput[0] -replace '^Apache Maven (\S+).*$', '$1'
        $versionMatches = $installedVersion -eq $env:MAVEN_VERSION
        Write-Host "Found Maven $installedVersion on PATH."
      } else {
        Write-Host "Maven is not on PATH."
      }

      if (-not $versionMatches) {
        Write-Host "Installing requested Maven $env:MAVEN_VERSION."
      }

      "matches=$($versionMatches.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  - name: Check Maven tool cache
    id: check-maven-cache
    if: steps.check-maven.outputs.matches != 'true'
    shell: bash
    env:
      MAVEN_VERSION: ${{ inputs.maven-version }}
    run: |
      maven_version_compare() {
        local left="$1"
        local right="$2"
        local index
        local left_component
        local right_component
        local -a left_parts=()
        local -a right_parts=()

        IFS='.' read -r -a left_parts <<< "$left"
        IFS='.' read -r -a right_parts <<< "$right"
        version_comparison=0

        for index in 0 1 2; do
          left_component=$((10#${left_parts[$index]}))
          right_component=$((10#${right_parts[$index]}))
          if ((left_component < right_component)); then
            version_comparison=-1
            return 0
          fi
          if ((left_component > right_component)); then
            version_comparison=1
            return 0
          fi
        done
        return 0
      }

      maven_parse_version_spec() {
        local version_spec="$1"
        local component
        local index
        local wildcard_seen=false
        local -a spec_parts=()

        while [[ "$version_spec" == =* || "$version_spec" == v* || "$version_spec" == V* ]]; do
          version_spec="${version_spec:1}"
        done

        [[ "$version_spec" =~ ^([0-9]+|[xX*])(\.([0-9]+|[xX*])){0,2}$ ]] || return 1
        IFS='.' read -r -a spec_parts <<< "$version_spec"
        ((${#spec_parts[@]} >= 1 && ${#spec_parts[@]} <= 3)) || return 1

        maven_range_major=0
        maven_range_minor=0
        maven_range_patch=0
        maven_range_precision=${#spec_parts[@]}

        for index in 0 1 2; do
          component="${spec_parts[$index]:-}"
          [[ -n "$component" ]] || break
          if [[ "$component" == x || "$component" == X || "$component" == '*' ]]; then
            if [[ "$wildcard_seen" != true ]]; then
              maven_range_precision="$index"
              wildcard_seen=true
            fi
            continue
          fi
          [[ "$wildcard_seen" != true ]] || return 1
          [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]] || return 1
          ((${#component} <= 16)) || return 1
          if ((${#component} == 16)) && ((10#$component > 9007199254740991)); then
            return 1
          fi

          case "$index" in
            0) maven_range_major=$((10#$component)) ;;
            1) maven_range_minor=$((10#$component)) ;;
            2) maven_range_patch=$((10#$component)) ;;
          esac
        done
        return 0
      }

      maven_validate_version_token() {
        local token="$1"
        local version_spec="$token"

        case "$token" in
          '>='*) version_spec="${token:2}" ;;
          '<='*) version_spec="${token:2}" ;;
          '>'*) version_spec="${token:1}" ;;
          '<'*) version_spec="${token:1}" ;;
          '='*) version_spec="${token:1}" ;;
          '^'*) version_spec="${token:1}" ;;
          '~'*) version_spec="${token:1}" ;;
        esac

        [[ -n "$version_spec" ]] || return 1
        maven_parse_version_spec "$version_spec"
      }

      maven_set_next_boundary() {
        local precision="$1"

        maven_upper_major="$maven_range_major"
        maven_upper_minor="$maven_range_minor"
        maven_upper_patch="$maven_range_patch"
        case "$precision" in
          1)
            maven_upper_major=$((maven_range_major + 1))
            maven_upper_minor=0
            maven_upper_patch=0
            ;;
          2)
            maven_upper_minor=$((maven_range_minor + 1))
            maven_upper_patch=0
            ;;
          3)
            maven_upper_patch=$((maven_range_patch + 1))
            ;;
        esac
      }

      maven_version_satisfies_token() {
        local cached_version="$1"
        local token="$2"
        local operator=""
        local version_spec="$token"
        local lower_bound
        local upper_bound

        case "$token" in
          '>='*) operator='>='; version_spec="${token:2}" ;;
          '<='*) operator='<='; version_spec="${token:2}" ;;
          '>'*) operator='>'; version_spec="${token:1}" ;;
          '<'*) operator='<'; version_spec="${token:1}" ;;
          '='*) operator='='; version_spec="${token:1}" ;;
          '^'*) operator='^'; version_spec="${token:1}" ;;
          '~'*) operator='~'; version_spec="${token:1}" ;;
        esac

        maven_parse_version_spec "$version_spec" || return 1
        lower_bound="$maven_range_major.$maven_range_minor.$maven_range_patch"

        case "$operator" in
          ''|'=')
            if ((maven_range_precision == 0)); then
              return 0
            fi
            if ((maven_range_precision == 3)); then
              maven_version_compare "$cached_version" "$lower_bound"
              ((version_comparison == 0))
              return
            fi
            maven_set_next_boundary "$maven_range_precision"
            upper_bound="$maven_upper_major.$maven_upper_minor.$maven_upper_patch"
            maven_version_compare "$cached_version" "$lower_bound"
            ((version_comparison >= 0)) || return 1
            maven_version_compare "$cached_version" "$upper_bound"
            ((version_comparison < 0))
            ;;
          '>=')
            ((maven_range_precision == 0)) && return 0
            maven_version_compare "$cached_version" "$lower_bound"
            ((version_comparison >= 0))
            ;;
          '>')
            ((maven_range_precision == 0)) && return 1
            if ((maven_range_precision == 3)); then
              maven_version_compare "$cached_version" "$lower_bound"
              ((version_comparison > 0))
              return
            fi
            maven_set_next_boundary "$maven_range_precision"
            upper_bound="$maven_upper_major.$maven_upper_minor.$maven_upper_patch"
            maven_version_compare "$cached_version" "$upper_bound"
            ((version_comparison >= 0))
            ;;
          '<')
            ((maven_range_precision == 0)) && return 1
            maven_version_compare "$cached_version" "$lower_bound"
            ((version_comparison < 0))
            ;;
          '<=')
            ((maven_range_precision == 0)) && return 0
            if ((maven_range_precision == 3)); then
              maven_version_compare "$cached_version" "$lower_bound"
              ((version_comparison <= 0))
              return
            fi
            maven_set_next_boundary "$maven_range_precision"
            upper_bound="$maven_upper_major.$maven_upper_minor.$maven_upper_patch"
            maven_version_compare "$cached_version" "$upper_bound"
            ((version_comparison < 0))
            ;;
          '~')
            ((maven_range_precision == 0)) && return 0
            maven_version_compare "$cached_version" "$lower_bound"
            ((version_comparison >= 0)) || return 1
            if ((maven_range_precision == 1)); then
              maven_set_next_boundary 1
            else
              maven_set_next_boundary 2
            fi
            upper_bound="$maven_upper_major.$maven_upper_minor.$maven_upper_patch"
            maven_version_compare "$cached_version" "$upper_bound"
            ((version_comparison < 0))
            ;;
          '^')
            ((maven_range_precision == 0)) && return 0
            maven_version_compare "$cached_version" "$lower_bound"
            ((version_comparison >= 0)) || return 1
            if ((maven_range_major > 0 || maven_range_precision == 1)); then
              maven_set_next_boundary 1
            elif ((maven_range_minor > 0 || maven_range_precision == 2)); then
              maven_set_next_boundary 2
            else
              maven_set_next_boundary 3
            fi
            upper_bound="$maven_upper_major.$maven_upper_minor.$maven_upper_patch"
            maven_version_compare "$cached_version" "$upper_bound"
            ((version_comparison < 0))
            ;;
        esac
      }

      maven_version_matches() {
        local version_spec="$1"
        local cached_version="$2"
        local candidate_version
        local remaining_spec
        local alternative
        local token
        local range_match
        local has_more
        local any_match=false
        local index
        local -a tokens=()
        local -a normalized_tokens=()

        while [[ "$version_spec" == =* || "$version_spec" == v* || "$version_spec" == V* ]]; do
          version_spec="${version_spec:1}"
        done

        candidate_version="$cached_version"
        [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
        maven_parse_version_spec "$candidate_version" || return 1
        ((maven_range_precision == 3)) || return 1
        [[ "$version_spec" == "$cached_version" ]] && return 0
        remaining_spec="$version_spec"

        while true; do
          if [[ "$remaining_spec" == *"||"* ]]; then
            alternative="${remaining_spec%%||*}"
            remaining_spec="${remaining_spec#*||}"
            has_more=true
          else
            alternative="$remaining_spec"
            has_more=false
          fi
          alternative="${alternative//,/ }"
          tokens=()
          normalized_tokens=()
          read -r -a tokens <<< "$alternative"
          ((${#tokens[@]} > 0)) || return 1

          if ((${#tokens[@]} == 3)) && [[ "${tokens[1]}" == '-' ]]; then
            tokens=(">=${tokens[0]}" "<=${tokens[2]}")
          fi

          range_match=true
          for ((index = 0; index < ${#tokens[@]}; index++)); do
            token="${tokens[$index]}"
            case "$token" in
              '>'|'<'|'>='|'<='|'='|'^'|'~')
                ((index + 1 < ${#tokens[@]})) || return 1
                token+="${tokens[$((index + 1))]}"
                index=$((index + 1))
                ;;
            esac
            maven_validate_version_token "$token" || return 1
            normalized_tokens+=("$token")
          done

          range_match=true
          for token in "${normalized_tokens[@]}"; do
            if ! maven_version_satisfies_token "$candidate_version" "$token"; then
              range_match=false
              break
            fi
          done

          [[ "$range_match" == true ]] && any_match=true
          [[ "$has_more" == true ]] || break
        done

        [[ "$any_match" == true ]]
      }

      cache_hit=false
      cache_root="${RUNNER_TOOL_CACHE:-}"
      tool_arch=""

      case "${RUNNER_ARCH:-}" in
        X86|x86) tool_arch="ia32" ;;
        X64|x64) tool_arch="x64" ;;
        ARM|arm) tool_arch="arm" ;;
        ARM64|arm64) tool_arch="arm64" ;;
      esac

      if [[ -n "$cache_root" && -n "$tool_arch" ]]; then
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          if command -v cygpath >/dev/null 2>&1; then
            if ! cache_root=$(cygpath -u "$cache_root"); then
              echo "::warning::Could not translate RUNNER_TOOL_CACHE; Maven Central availability check will run."
              cache_root=""
            fi
          else
            echo "::warning::Could not find cygpath; Maven Central availability check will run."
            cache_root=""
          fi
        fi

        if [[ -n "$cache_root" ]]; then
          for cached_maven in "$cache_root"/maven/*/"$tool_arch"; do
            [[ -d "$cached_maven" && -f "$cached_maven.complete" ]] || continue
            cached_version="${cached_maven%/"$tool_arch"}"
            cached_version="${cached_version##*/}"
            if maven_version_matches "$MAVEN_VERSION" "$cached_version"; then
              cache_hit=true
              break
            fi
          done
        fi
      fi

      printf 'hit=%s\n' "$cache_hit" >> "$GITHUB_OUTPUT"
  - name: Verify Maven distribution availability
    if: steps.check-maven.outputs.matches != 'true' && steps.check-maven-cache.outputs.hit != 'true'
    shell: bash
    env:
      MAVEN_VERSION: ${{ inputs.maven-version }}
    run: |
      distribution_url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"

      if ! status_code=$(curl --silent --show-error --head --location \
        --retry 2 --retry-delay 1 --retry-connrefused --max-time 30 \
        --output /dev/null --write-out '%{http_code}' "$distribution_url"); then
        echo "::error::Could not verify the Maven distribution for version '${MAVEN_VERSION}' at '${distribution_url}'."
        exit 1
      fi

      if [ "$status_code" != "200" ]; then
        echo "::error::Maven distribution for version '${MAVEN_VERSION}' returned HTTP ${status_code} at '${distribution_url}'."
        exit 1
      fi
  - name: Setup Maven
    if: steps.check-maven.outputs.matches != 'true'
    uses: stCarolas/setup-maven@v5
    with:
      maven-version: ${{ inputs.maven-version }}
 # Camunda Nexus and extra mirrors/servers must be merged on ids (extra values have precedence).
  - name: Get Maven mirrors and servers to use
    id: maven
    env:
      # Camunda Nexus is disabled for fork PRs
      CAMUNDA_NEXUS_ENABLED: >-
        ${{
          steps.is-fork.outputs.is-fork != 'true' &&
          inputs.camunda-nexus == 'true'
        }}
      CAMUNDA_NEXUS_MAVEN_MIRROR: >-
        [{
          "id": "camunda-nexus",
          "name": "Camunda Nexus",
          "url": "https://repository.nexus.camunda.cloud/content/groups/internal/",
          "mirrorOf": "*"
        }]
      CAMUNDA_NEXUS_MAVEN_SERVER: >-
        [{
          "id": "camunda-nexus",
          "username": "${{ steps.secrets.outputs.NEXUS_APP_CAMUNDA_COM_USR }}",
          "password": "${{ steps.secrets.outputs.NEXUS_APP_CAMUNDA_COM_PSW }}"
        },
        {
          "id": "camunda-artifactory",
          "username": "${{ steps.secrets.outputs.ARTIFACTORY_USR }}",
          "password": "${{ steps.secrets.outputs.ARTIFACTORY_PSW }}"
        }]
      EXTRA_MAVEN_MIRRORS: ${{ inputs.maven-mirrors }}
      EXTRA_MAVEN_SERVERS: ${{ inputs.maven-servers }}
    run: |
      # If Camunda Nexus is disabled, reset default mirrors/servers to empty lists
      if [ "${CAMUNDA_NEXUS_ENABLED}" != "true" ]; then
        CAMUNDA_NEXUS_MAVEN_MIRROR="[]"
        CAMUNDA_NEXUS_MAVEN_SERVER="[]"
      fi

      # Use jq 'add' operator to merge grouped sublists
      mirrors=$(\
        jq -n \
        --argjson nexus_mirror "${CAMUNDA_NEXUS_MAVEN_MIRROR}" \
        --argjson maven_mirrors "${EXTRA_MAVEN_MIRRORS}" \
        '[ $nexus_mirror + $maven_mirrors | group_by(.id)[] | add ]'
      )
      servers=$(\
        jq -n \
        --argjson nexus_server "${CAMUNDA_NEXUS_MAVEN_SERVER}" \
        --argjson maven_servers "${EXTRA_MAVEN_SERVERS}" \
        '[ $nexus_server + $maven_servers | group_by(.id)[] | add ]'
      )

      echo mirrors=$mirrors >> $GITHUB_OUTPUT
      echo servers=$servers >> $GITHUB_OUTPUT
    shell: bash
  - name: Update Maven settings.xml
    uses: s4u/maven-settings-action@v4.1.0
    with:
      githubServer: false
      servers: ${{ steps.maven.outputs.servers }}
      mirrors: ${{ steps.maven.outputs.mirrors }}
